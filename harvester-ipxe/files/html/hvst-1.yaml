scheme_version: 1
token: supersecuretoken
os:
  hostname: hvst-1
  ntp_servers:
    - 192.168.200.1
  password: rancher
install:
  addons:
    rancher_monitoring:
      enabled: true
  data_disk: dev/vdb
  device: /dev/vda
  iso_url: http://192.168.200.1/harvester-v1.9.0-govt.experimental.2-amd64.iso
  mode: create
  management_interface:
    interfaces:
      - name: enp1s0
      - name: enp2s0
    method: dhcp
  skipchecks: true
  vip: 192.168.200.10
  vip_mode: static
  wipe_all_disks: true